<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock — BNS Stock Manager</title>
  <link rel="icon" href="/uploads/images/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body data-page="stock" data-title="Gestion du stock">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <!-- Alertes stock faible -->
        <div class="card" id="alerts-card" style="display:none">
          <div class="card-header"><h2>⚠ Alertes stock</h2></div>
          <div class="low-stock-list" id="alerts-list"></div>
        </div>

        <!-- Nouveau mouvement -->
        <div class="card">
          <div class="card-header"><h2>Ajouter / Retirer du stock</h2></div>
          <form id="movement-form" class="toolbar" style="align-items:flex-end">
            <div class="form-group" style="flex:2;min-width:200px;margin:0">
              <label class="required">Produit</label>
              <select id="mov-product" required></select>
            </div>
            <div class="form-group" style="width:130px;margin:0">
              <label class="required">Type</label>
              <select id="mov-type">
                <option value="entree">Entrée (+)</option>
                <option value="sortie">Sortie (−)</option>
              </select>
            </div>
            <div class="form-group" style="width:110px;margin:0">
              <label class="required">Quantité</label>
              <input type="number" id="mov-quantity" min="1" value="1" required>
            </div>
            <div class="form-group" style="flex:2;min-width:160px;margin:0">
              <label>Motif</label>
              <input type="text" id="mov-reason" placeholder="Ex : livraison fournisseur">
            </div>
            <button type="submit" class="btn btn-primary">Valider</button>
          </form>
        </div>

        <!-- Historique -->
        <div class="card">
          <div class="card-header"><h2>Historique des mouvements</h2></div>
          <div class="table-wrap">
            <table class="data-table">
              <thead id="table-head"></thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/stock.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produits — BNS Stock Manager</title>
  <link rel="icon" href="/uploads/images/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body data-page="products" data-title="Gestion des produits">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="card">
          <div class="card-header">
            <div class="toolbar">
              <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input type="text" id="search-input" placeholder="Rechercher un produit…" style="width:240px">
              </div>
              <select id="category-filter" style="width:180px">
                <option value="">Toutes les catégories</option>
              </select>
            </div>
            <button class="btn btn-primary" id="btn-add">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
              Nouveau produit
            </button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead id="table-head"></thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paramètres — BNS Stock Manager</title>
  <link rel="icon" href="/uploads/images/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body data-page="settings" data-title="Paramètres">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="card" style="max-width:640px">
          <div class="card-header"><h2>Informations de l'entreprise</h2></div>
          <form id="settings-form">
            <div class="form-group">
              <label>Logo</label>
              <div style="display:flex;align-items:center;gap:14px">
                <div class="img-preview" id="logo-preview"><span>Aucun</span></div>
                <input type="file" id="company_logo_file" accept="image/*" style="max-width:280px">
              </div>
            </div>
            <div class="form-group">
              <label class="required">Nom de l'entreprise</label>
              <input type="text" id="company_name" required>
            </div>
            <div class="form-group">
              <label>Adresse</label>
              <textarea id="company_address" rows="2"></textarea>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Téléphone</label>
                <input type="text" id="company_phone">
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="company_email">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="required">TVA (%)</label>
                <input type="number" id="tva_rate" min="0" max="100" step="0.01" required>
              </div>
              <div class="form-group">
                <label class="required">Devise</label>
                <select id="currency">
                  <option value="MAD">MAD — Dirham marocain</option>
                  <option value="EUR">EUR — Euro</option>
                  <option value="USD">USD — Dollar</option>
                  <option value="DZD">DZD — Dinar algérien</option>
                  <option value="TND">TND — Dinar tunisien</option>
                  <option value="XOF">XOF — Franc CFA</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </form>
        </div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>

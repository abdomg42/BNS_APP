<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Document — BNS Stock Manager</title>
  <style>
    /* Feuille autonome optimisée pour l'impression / export PDF */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #2b333c;
      background: #eef1f5;
      font-size: 13px;
    }
    .toolbar {
      background: #1e6fd9;
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .toolbar button {
      border: none;
      border-radius: 7px;
      padding: 9px 20px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .btn-print { background: #fff; color: #1e6fd9; }
    .btn-close { background: rgba(255,255,255,.2); color: #fff; }
    .sheet {
      background: #fff;
      max-width: 800px;
      margin: 24px auto;
      padding: 40px 44px;
      box-shadow: 0 3px 14px rgba(0,0,0,.12);
      border-radius: 4px;
    }
    .doc-header { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .doc-header img { max-height: 70px; max-width: 180px; object-fit: contain; }
    .company { text-align: right; font-size: 12px; color: #5b6672; line-height: 1.6; }
    .company strong { color: #2b333c; font-size: 14px; }
    .doc-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: #1e6fd9;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .doc-number { text-align: center; color: #5b6672; margin-bottom: 22px; }
    .parties { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .party {
      background: #f5f7fa;
      border-radius: 8px;
      padding: 12px 16px;
      flex: 1;
      font-size: 12px;
      line-height: 1.6;
    }
    .party h4 { font-size: 11px; text-transform: uppercase; color: #1e6fd9; letter-spacing: .5px; margin-bottom: 5px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th {
      background: #1e6fd9;
      color: #fff;
      padding: 9px 12px;
      text-align: left;
      font-size: 12px;
    }
    th:last-child, td:last-child { text-align: right; }
    th:nth-child(3), td:nth-child(3) { text-align: center; }
    td { padding: 9px 12px; border-bottom: 1px solid #eef1f5; }
    .totals { margin-left: auto; width: 280px; }
    .totals .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
    .totals .row.grand {
      border-top: 2px solid #1e6fd9;
      margin-top: 6px;
      padding-top: 10px;
      font-size: 16px;
      font-weight: 700;
      color: #155bb5;
    }
    .doc-footer {
      margin-top: 36px;
      padding-top: 14px;
      border-top: 1px solid #dde3ea;
      text-align: center;
      font-size: 11px;
      color: #9aa5b1;
    }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .sheet { box-shadow: none; margin: 0; max-width: none; padding: 10px; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="btn-print" onclick="window.print()">🖨 Imprimer / Enregistrer en PDF</button>
    <button class="btn-close" onclick="window.close()">Fermer</button>
  </div>
  <div class="sheet" id="sheet"><p style="text-align:center;padding:40px">Chargement…</p></div>
  <script src="js/utils.js"></script>
  <script src="js/print.js"></script>
</body>
</html>

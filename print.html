<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Document — BNS Stock Manager</title>
  <style>
    /* Feuille autonome optimisée pour l'impression / export PDF */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #2b333c;
      background: #eef1f5;
      font-size: 13px;
    }
    .toolbar {
      background: #1e6fd9;
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .toolbar button {
      border: none;
      border-radius: 7px;
      padding: 9px 20px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .btn-print { background: #fff; color: #1e6fd9; }
    .btn-pdf { background: #fff; color: #1e6fd9; }
    .btn-close { background: rgba(255,255,255,.2); color: #fff; }
    .sheet {
      background: #fff;
      max-width: 210mm;
      margin: 24px auto;
      padding: 10mm 12mm 34mm;
      box-shadow: 0 3px 14px rgba(0,0,0,.12);
      border-radius: 4px;
      position: relative;
      min-height: 260mm;
    }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .sheet { box-shadow: none; margin: 0; max-width: none; padding: 6mm 8mm 0; min-height: auto; }
    }
  </style>
  <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <div class="toolbar">
    <button class="btn-print" onclick="window.print()">🖨 Imprimer</button>
    <button class="btn-pdf" onclick="downloadPDF()">📥 Télécharger PDF</button>
    <button class="btn-close" onclick="window.close()">Fermer</button>
  </div>
  <div class="sheet" id="sheet"><p style="text-align:center;padding:40px">Chargement…</p></div>
  <script src="js/utils.js"></script>
  <script src="js/vendor/html2pdf.bundle.min.js"></script>
  <script src="js/print.js"></script>
</body>
</html>

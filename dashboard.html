<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord — BNS Stock Manager</title>
  <link rel="icon" href="/uploads/images/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body data-page="dashboard" data-title="Tableau de bord">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <!-- Cartes statistiques -->
        <div class="stats-grid" id="stats-grid"></div>

        <!-- Produits en faible stock -->
        <div class="card">
          <div class="card-header">
            <h2>Produits en faible stock</h2>
            <a href="stock.html" class="btn btn-outline btn-sm">Gérer le stock</a>
          </div>
          <div class="low-stock-list" id="low-stock-list"></div>
        </div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
